name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo lee el repo
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Docker ya viene en el runner: Testcontainers funciona sin configuración extra
      - name: Verify
        run: ./mvnw -B verify

      - name: Subir reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
